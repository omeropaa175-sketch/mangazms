<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mangazms</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09090d;color:#f7f7fa;font-family:Arial,Tahoma,sans-serif;line-height:1.7}button,input{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:1200px;margin:auto;padding:0 18px}.header{position:sticky;top:0;z-index:50;background:#09090df2;backdrop-filter:blur(14px);border-bottom:1px solid #292936}.nav{min-height:68px;display:flex;align-items:center;gap:12px}.logo{font-size:25px;font-weight:900;cursor:pointer;white-space:nowrap}.logo span{color:#8b5cf6}.links{display:flex;gap:3px;flex-wrap:wrap}.links button,.ghost{background:transparent;color:#aaa;padding:8px 9px;border-radius:9px;white-space:nowrap}.links button:hover,.ghost:hover{background:#171720;color:#fff}.search{margin-right:auto;display:flex;background:#171720;border:1px solid #30303c;border-radius:11px;overflow:hidden;min-width:210px}.search input{width:210px;padding:8px 10px;border:0;outline:0;background:transparent;color:#fff}.search button,.primary{background:#8b5cf6;color:#fff;padding:8px 13px}.account{display:flex;gap:5px;align-items:center}.account button{background:#171720;color:#ddd;border:1px solid #30303c;border-radius:9px;padding:7px 9px}.adminLink{font-size:11px;color:#666!important;background:transparent!important;border:0!important}.menu{display:none;background:#171720;color:#fff;border:1px solid #30303c;border-radius:9px;padding:8px 10px}.hero{margin:28px 0;padding:48px 30px;border:1px solid #35265a;border-radius:24px;background:linear-gradient(135deg,#24164b,#15151e 65%,#0f0f15)}.hero h1{font-size:42px;margin:0 0 8px}.hero p{color:#c5c5d0;max-width:700px}.section{margin:30px 0}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:17px}.card{background:#171720;border:1px solid #292936;border-radius:15px;overflow:hidden;transition:.18s;cursor:pointer}.card:hover{transform:translateY(-3px);border-color:#5b4b79}.cover{aspect-ratio:2/3;background:linear-gradient(135deg,#31204f,#111);background-size:cover;background-position:center;position:relative}.type{position:absolute;top:10px;right:10px;background:#000b;border:1px solid #ffffff22;padding:3px 8px;border-radius:8px;font-size:12px}.fav{position:absolute;left:8px;top:8px;width:34px;height:34px;border-radius:50%;background:#000b;color:#fff;border:1px solid #ffffff22}.body{padding:12px}.body h3{margin:0 0 3px;font-size:17px}.body p{margin:0;color:#aaa;font-size:13px}.page{display:none}.page.active{display:block}.detail{margin-top:30px;background:#171720;border:1px solid #292936;border-radius:20px;padding:24px;display:grid;grid-template-columns:260px 1fr;gap:28px}.detailcover{border-radius:14px;overflow:hidden;background:#111}.detailcover img{width:100%;display:block;aspect-ratio:2/3;object-fit:cover}.meta{color:#aaa}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{background:#20202b;padding:4px 9px;border-radius:20px;color:#ccc;font-size:12px}.chapters{display:grid;gap:8px;margin-top:22px}.chapter{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;background:#101017;border:1px solid #292936;border-radius:11px;color:#fff;width:100%;text-align:right}.readerTop{position:sticky;top:68px;z-index:10;background:#09090df2;backdrop-filter:blur(12px);border-bottom:1px solid #292936;padding:10px}.readerTop .inner{max-width:1000px;margin:auto;display:flex;gap:8px;align-items:center;justify-content:space-between}.readerControls{display:none;gap:7px;flex-wrap:wrap;justify-content:center;padding:10px 0}.readerControls.open{display:flex}.readerControls button{background:#20202b;color:#fff;border:1px solid #30303c;padding:7px 10px;border-radius:9px}.readerPages{max-width:900px;margin:auto;padding:14px 10px 50px}.readerPages img{display:block;width:100%;height:auto;margin:0 auto 7px}.empty{text-align:center;color:#aaa;padding:60px 10px}.modal{position:fixed;inset:0;background:#000b;z-index:100;display:none;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.modalBox{width:min(460px,100%);background:#171720;border:1px solid #30303c;border-radius:18px;padding:22px}.modalBox input{width:100%;background:#0e0e14;color:#fff;border:1px solid #30303c;border-radius:9px;padding:10px;margin:6px 0}.oauth{display:grid;gap:8px;margin:12px 0}.oauth button{padding:10px;border-radius:9px;background:#20202b;color:#fff;border:1px solid #30303c}.small{font-size:12px;color:#888}.close{float:left;background:transparent;color:#aaa;font-size:22px}footer{text-align:center;color:#666;padding:45px 10px}
@media(max-width:1050px){.links button{padding:7px 6px}.search input{width:160px}}@media(max-width:760px){.nav{flex-wrap:wrap;padding:10px 0}.menu{display:block}.links{display:none;order:5;width:100%;background:#101017;padding:7px;border-radius:10px}.links.open{display:grid;grid-template-columns:repeat(2,1fr)}.links button{text-align:center}.search{order:4;flex:1;min-width:120px}.search input{width:100%}.account{order:3}.adminLink{display:none}.hero h1{font-size:31px}.detail{grid-template-columns:1fr}.detailcover{max-width:270px;margin:auto}.grid{grid-template-columns:repeat(2,1fr);gap:11px}.cover{aspect-ratio:2/2.8}.body{padding:9px}.body h3{font-size:15px}.readerTop{top:0}}
</style></head><body>
<header class="header"><nav class="wrap nav"><div class="logo" onclick="goHome()">Manga<span>zms</span></div><button class="menu" onclick="document.querySelector('.links').classList.toggle('open')">☰</button><div class="links"><button onclick="goHome()">الرئيسية</button><button onclick="showAll()">كل الأعمال</button><button onclick="filterType('manga')">المانجا</button><button onclick="filterType('manhwa')">المانهوا</button><button onclick="showLatest()">الأحدث</button><button onclick="showHistory()">آخر مشاهدة</button><button onclick="showFavorites()">المفضلة</button></div><div class="search"><input id="q" placeholder="ابحث عن عمل..." oninput="search()"><button onclick="search()">بحث</button></div><div class="account"><button id="authBtn" onclick="openAuth()">دخول</button><button class="adminLink" onclick="location.href='admin.html'">دخول الإداريين</button></div></nav></header>
<main class="wrap"><section id="home" class="page active"><div class="hero"><h1>مرحباً بك في Mangazms</h1><p>اقرأ المانجا والمانهوا بواجهة داكنة وسريعة، مع مفضلة وآخر مشاهدة للحسابات المسجلة.</p><button class="primary" onclick="showAll()">تصفح الأعمال</button></div><div class="section"><div class="title"><h2>⭐ المميزة</h2></div><div id="featured" class="grid"></div></div><div class="section"><div class="title"><h2>🆕 الأحدث</h2></div><div id="latest" class="grid"></div></div></section><section id="all" class="page"><div class="section"><div class="title"><h2 id="allTitle">📚 كل الأعمال</h2></div><div id="allGrid" class="grid"></div></div></section><section id="detailPage" class="page"><div id="detail"></div></section><section id="readerPage" class="page"><div id="reader"></div></section></main><footer>Mangazms © 2026</footer>
<div id="authModal" class="modal"><div class="modalBox"><button class="close" onclick="closeAuth()">×</button><h2 id="authTitle">تسجيل الدخول</h2><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><div class="oauth"><button onclick="oauth('google')">🔴 الدخول بواسطة Google</button><button onclick="oauth('apple')"> الدخول بواسطة Apple</button></div><button class="primary" style="width:100%" onclick="emailAuth()" id="emailBtn">دخول</button><p class="small" id="authMsg"></p><button class="ghost" style="width:100%" onclick="toggleSignup()" id="switchBtn">إنشاء حساب جديد</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='%%SUPABASE_URL%%',SUPABASE_ANON_KEY='%%SUPABASE_ANON_KEY%%';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let works=[],user=null,isSignup=false;let pendingSection=null;
const $=id=>document.getElementById(id);function hide(){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'))}function goHome(){hide();$('home').classList.add('active');scrollTo(0,0)}function showAll(){hide();$('all').classList.add('active');$('allTitle').textContent='📚 كل الأعمال';renderGrid('allGrid',works);scrollTo(0,0)}function card(m){let cover=m.cover_url?`background-image:url('${esc(m.cover_url)}')`:'';return `<article class="card" onclick="openWork('${m.id}')"><div class="cover" style="${cover}"><span class="type">${m.type==='manhwa'?'مانهوا':'مانجا'}</span><button class="fav" onclick="event.stopPropagation();toggleFavorite('${m.id}')">♡</button></div><div class="body"><h3>${esc(m.title)}</h3><p>${esc(m.genre||'غير مصنف')}</p></div></article>`}function renderGrid(id,list){$(id).innerHTML=list.length?list.map(card).join(''):`<div class="empty">لا توجد أعمال هنا حالياً.</div>`}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function load(){let r=await sb.from('mangas').select('*').order('created_at',{ascending:false});works=r.data||[];render();await refreshAuth()}function render(){renderGrid('featured',works.slice(0,6));renderGrid('latest',works.slice(0,12));renderGrid('allGrid',works)}async function refreshAuth(){let r=await sb.auth.getUser();user=r.data.user||null;$('authBtn').textContent=user?'حسابي':'دخول';if(user&&pendingSection){let target=pendingSection;pendingSection=null;closeAuth();if(target==='favorites')await showFavorites();else if(target==='history')await showHistory();}}
function openAuth(){if(user){if(confirm('هل تريد تسجيل الخروج؟')){sb.auth.signOut().then(refreshAuth)}return}$('authModal').classList.add('open');$('authMsg').textContent=''}function closeAuth(){$('authModal').classList.remove('open')}function toggleSignup(){isSignup=!isSignup;$('authTitle').textContent=isSignup?'إنشاء حساب':'تسجيل الدخول';$('emailBtn').textContent=isSignup?'إنشاء الحساب':'دخول';$('switchBtn').textContent=isSignup?'لدي حساب بالفعل':'إنشاء حساب جديد'}async function emailAuth(){let email=$('email').value.trim(),password=$('password').value;if(!email||!password)return $('authMsg').textContent='أدخل البريد وكلمة المرور.';let r=isSignup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});if(r.error)return $('authMsg').textContent=r.error.message;if(isSignup&&r.data.session===null){$('authMsg').textContent='تم إنشاء الحساب. تحقق من بريدك الإلكتروني ثم سجّل الدخول.';return}user=r.data.user;await refreshAuth();if(!pendingSection)closeAuth()}async function oauth(provider){let r=await sb.auth.signInWithOAuth({provider,options:{redirectTo:location.origin+location.pathname}});if(r.error)$('authMsg').textContent=r.error.message}
async function toggleFavorite(id){if(!user){openAuth();return}let q=await sb.from('user_favorites').select('manga_id').eq('manga_id',id).maybeSingle();if(q.data)await sb.from('user_favorites').delete().eq('manga_id',id);else await sb.from('user_favorites').insert({user_id:user.id,manga_id:id});}async function showFavorites(){if(!user){pendingSection='favorites';$('authModal').classList.add('open');$('authMsg').textContent='سجّل الدخول أولاً لفتح المفضلة.';return;}hide();$('all').classList.add('active');$('allTitle').textContent='❤️ المفضلة';let r=await sb.from('user_favorites').select('manga_id');let ids=(r.data||[]).map(x=>x.manga_id);renderGrid('allGrid',works.filter(x=>ids.includes(x.id)))}async function showHistory(){if(!user){pendingSection='history';$('authModal').classList.add('open');$('authMsg').textContent='سجّل الدخول أولاً لفتح آخر مشاهدة.';return;}hide();$('all').classList.add('active');$('allTitle').textContent='🕘 آخر مشاهدة';let r=await sb.from('user_history').select('manga_id,last_viewed_at').order('last_viewed_at',{ascending:false}).limit(30);let map=(r.data||[]).map(x=>x.manga_id);renderGrid('allGrid',map.map(id=>works.find(x=>x.id===id)).filter(Boolean))}function filterType(type){hide();$('all').classList.add('active');$('allTitle').textContent=type==='manga'?'📘 المانجا':'📕 المانهوا';renderGrid('allGrid',works.filter(x=>x.type===type))}function showLatest(){hide();$('all').classList.add('active');$('allTitle').textContent='🆕 الأحدث';renderGrid('allGrid',works)}function search(){let q=$('q').value.trim().toLowerCase();hide();$('all').classList.add('active');$('allTitle').textContent='🔎 نتائج البحث';renderGrid('allGrid',works.filter(m=>(m.title+' '+(m.author||'')+' '+(m.genre||'')+' '+(m.description||'')).toLowerCase().includes(q)))}
async function openWork(id){let m=works.find(x=>String(x.id)===String(id));if(!m)return;if(user)await sb.from('user_history').upsert({user_id:user.id,manga_id:m.id,last_viewed_at:new Date().toISOString()});hide();$('detailPage').classList.add('active');let r=await sb.from('chapters').select('*').eq('manga_id',id).order('number',{ascending:false});let chapters=r.data||[];let list=chapters.length?chapters.map(c=>`<button class="chapter" onclick="openChapter('${c.id}')"><span>الفصل ${c.number}${c.title?' — '+esc(c.title):''}</span><span>›</span></button>`).join(''):`<div class="empty">لا توجد فصول منشورة بعد.</div>`;let img=m.cover_url?`<img src="${esc(m.cover_url)}" alt="${esc(m.title)}">`:`<div style="aspect-ratio:2/3"></div>`;$('detail').innerHTML=`<div class="detail"><div class="detailcover">${img}</div><div><button class="ghost" onclick="showAll()">← العودة</button><h1>${esc(m.title)}</h1><p class="meta">${esc(m.author||'')} ${m.author?'•':''} ${esc(m.genre||'')}</p><div class="tags"><span class="tag">${m.type==='manhwa'?'مانهوا':'مانجا'}</span></div><p>${esc(m.description||'')}</p><div class="chapters">${list}</div></div></div>`;scrollTo(0,0)}
async function openChapter(cid){let {data:c}=await sb.from('chapters').select('*').eq('id',cid).single();if(!c)return;let {data:pages}=await sb.from('chapter_pages').select('*').eq('chapter_id',cid).order('page_number');hide();$('readerPage').classList.add('active');$('reader').innerHTML=`<div class="readerTop"><div class="inner"><button class="ghost" onclick="openWork('${c.manga_id}')">← خروج</button><strong>الفصل ${c.number}</strong><button class="ghost" onclick="toggleSettings()">⚙ الإعدادات</button></div><div id="readerControls" class="readerControls"><button onclick="readerZoom(-.1)">تصغير</button><button onclick="readerZoom(.1)">تكبير</button><button onclick="readerBg()">تغيير لون الشاشة</button></div></div><div id="readerPages" class="readerPages">${(pages||[]).map(p=>`<img loading="lazy" src="${esc(p.image_url)}" alt="صفحة ${p.page_number}">`).join('')||'<div class="empty">لا توجد صفحات.</div>'}</div>`;window.__zoom=1;window.__bg=0}function toggleSettings(){$('readerControls').classList.toggle('open')}function readerZoom(d){window.__zoom=Math.min(1.8,Math.max(.7,(window.__zoom||1)+d));$('readerPages').style.maxWidth=(900*window.__zoom)+'px'}function readerBg(){window.__bg=(window.__bg+1)%3;let a=['#09090d','#171717','#f0ede7'];document.body.style.background=a[window.__bg];document.body.style.color=window.__bg===2?'#111':'#fff'}
sb.auth.onAuthStateChange(()=>refreshAuth());load();
</script></body></html>
