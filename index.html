<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mangazms</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0b0b10;--card:#14141c;--line:#292936;--text:#f3f3f7;--muted:#9b9baa;--accent:#8b5cf6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.site{min-height:100vh}
header{position:sticky;top:0;z-index:20;background:rgba(11,11,16,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.nav{max-width:1200px;margin:auto;min-height:68px;display:flex;align-items:center;gap:18px;padding:10px 18px}
.logo{font-size:25px;font-weight:900;color:#fff;letter-spacing:-.5px}
.links{display:flex;gap:6px;align-items:center;flex:1;justify-content:center}.links button{border:0;background:transparent;color:#c9c9d3;padding:11px 14px;border-radius:10px;font-size:17px;font-weight:700}.links button:hover{background:#191922;color:#fff}
.admin-small{width:34px;height:34px;border-radius:9px;border:1px solid #252530;background:#121219;color:#777;font-size:15px;opacity:.45;padding:0}.admin-small:hover{opacity:.9;color:#ddd}
.search{display:flex;gap:6px;min-width:270px}.search input{width:100%;background:#15151e;border:1px solid var(--line);color:#fff;border-radius:10px;padding:10px 12px}.search button,.primary{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 15px;font-weight:700}
main{max-width:1200px;margin:auto;padding:28px 18px}.hero{padding:35px 0 20px}.hero h1{font-size:42px;margin:0 0 10px}.hero p{color:var(--muted);font-size:17px}.section{margin:34px 0}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:15px}.head h2{margin:0;font-size:25px}.head p{margin:5px 0 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-2px);border-color:#4b3b67}.cover{aspect-ratio:3/4;background:#1a1a24;display:flex;align-items:center;justify-content:center;color:#777;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.body{padding:12px}.title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:var(--muted);font-size:13px;margin-top:6px}.badge{display:inline-block;margin-top:8px;padding:4px 8px;border-radius:99px;background:#211a2c;color:#c9b7ff;font-size:12px}.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;grid-column:1/-1}
.page{display:none}.back{margin-bottom:18px;background:#171720;color:#ddd;border:1px solid var(--line);border-radius:10px;padding:9px 12px}.detail{display:grid;grid-template-columns:220px 1fr;gap:25px}.detail-cover{aspect-ratio:3/4;background:#171720;border-radius:14px;overflow:hidden}.detail-cover img{width:100%;height:100%;object-fit:cover}.chapters{margin-top:24px;display:grid;gap:8px}.chapter{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;background:#14141c;border:1px solid var(--line);border-radius:10px}.chapter button{background:none;border:0;color:#fff}
.reader{max-width:900px;margin:auto}.reader-toolbar{position:sticky;top:75px;z-index:5;display:flex;gap:7px;flex-wrap:wrap;padding:10px;background:rgba(11,11,16,.94);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}.reader-toolbar button{background:#171720;color:#ddd;border:1px solid var(--line);border-radius:8px;padding:8px 10px}.pages{display:grid;gap:8px}.pages img{width:100%;height:auto;display:block;background:#111}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}.box{width:min(720px,100%);max-height:90vh;overflow:auto;background:#121219;border:1px solid var(--line);border-radius:16px;padding:20px}.box h2{margin-top:0}.form{display:grid;gap:10px}.form input,.form select,.form textarea{width:100%;background:#181821;color:#fff;border:1px solid var(--line);border-radius:9px;padding:11px}.row{display:flex;gap:8px;flex-wrap:wrap}.danger{background:#7f1d1d!important}.muted{color:var(--muted)}.notice{padding:10px 12px;background:#191922;border:1px solid var(--line);border-radius:9px;color:#bbb}.admin-list{display:grid;gap:7px;margin:12px 0}.admin-item{display:flex;justify-content:space-between;padding:10px;background:#181821;border-radius:9px}.toast{position:fixed;bottom:20px;left:20px;background:#171720;border:1px solid var(--line);padding:11px 14px;border-radius:10px;display:none;z-index:200}
@media(max-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.search{min-width:200px}}
@media(max-width:760px){.nav{flex-wrap:wrap;gap:7px}.logo{font-size:21px}.links{order:3;width:100%;overflow:auto;justify-content:flex-start}.links button{font-size:14px;padding:8px 10px}.search{flex:1;min-width:160px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero h1{font-size:31px}.detail{grid-template-columns:120px 1fr}}
@media(max-width:430px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.body{padding:9px}.detail{grid-template-columns:1fr}.detail-cover{max-width:180px}.admin-small{width:30px;height:30px}}
</style>
</head>
<body>
<div class="site">
<header><div class="nav">
<div class="logo">Mangazms</div>
<div class="links">
<button onclick="showHome()">الرئيسية</button><button onclick="showCatalog('all')">الكل</button><button onclick="showCatalog('مانجا')">المانجا</button><button onclick="showCatalog('مانهوا')">المانهوا</button><button onclick="showFavorites()">المفضلة</button>
</div>
<div class="search"><input id="searchInput" placeholder="ابحث عن مانجا..." onkeydown="if(event.key==='Enter')searchNow()"><button onclick="searchNow()">بحث</button></div>
<button class="admin-small" title="لوحة الإداريين" onclick="openAdmin()">⚙</button>
</div></header>
<main>
<section id="homePage" class="page" style="display:block">
<div class="hero"><h1>مرحبًا بك في Mangazms</h1><p>مكتبة المانجا والمانهوا الخاصة بك — الإضافات الجديدة تظهر أولًا.</p></div>
<div class="section"><div class="head"><div><h2>🆕 الأحدث</h2><p>من الجديد إلى القديم</p></div></div><div id="latestGrid" class="grid"></div></div>
</section>
<section id="catalogPage" class="page"><button class="back" onclick="showHome()">← الرئيسية</button><div class="head"><div><h2 id="catalogTitle">الكل</h2></div></div><div id="catalogGrid" class="grid"></div></section>
<section id="favoritesPage" class="page"><button class="back" onclick="showHome()">← الرئيسية</button><div class="head"><div><h2>❤️ المفضلة</h2></div></div><div id="favoritesGrid" class="grid"></div></section>
<section id="detailPage" class="page"><button class="back" onclick="showHome()">← الرئيسية</button><div id="detailContent"></div></section>
<section id="readerPage" class="page"><button class="back" onclick="showHome()">← الرئيسية</button><div id="readerContent"></div></section>
</main>
</div>

<div id="adminModal" class="modal"><div class="box">
<h2>لوحة الإداريين</h2><p class="muted">تسجيل الدخول الحقيقي يتم عبر Supabase.</p>
<div id="loginBox" class="form">
<input id="adminEmail" type="email" placeholder="البريد الإلكتروني">
<input id="adminPassword" type="password" placeholder="كلمة المرور">
<button class="primary" onclick="adminLogin()">دخول</button><button onclick="closeAdmin()">إغلاق</button>
</div>
<div id="adminPanel" style="display:none">
<div class="notice" id="adminWho"></div>
<h3>إضافة مانجا / مانهوا</h3>
<div class="form">
<input id="newTitle" placeholder="اسم العمل">
<select id="newType"><option>مانجا</option><option>مانهوا</option></select>
<textarea id="newDesc" placeholder="الوصف"></textarea>
<input id="newCover" type="url" placeholder="رابط صورة الغلاف">
<input id="newGenres" placeholder="التصنيفات مفصولة بفاصلة">
<button class="primary" onclick="addManga()">إضافة العمل</button>
</div>
<h3>إضافة فصل</h3>
<div class="form">
<select id="chapterManga"></select>
<input id="chapterNumber" type="number" step="0.1" placeholder="رقم الفصل">
<input id="chapterTitle" placeholder="عنوان الفصل (اختياري)">
<input id="chapterFiles" type="file" accept="image/*" multiple>
<button class="primary" onclick="uploadChapter()">رفع الفصل والصور</button>
</div>
<h3>الإداريون</h3><div id="adminList" class="admin-list"></div>
<div class="row"><button onclick="adminLogout()">تسجيل الخروج</button><button onclick="closeAdmin()">إغلاق</button></div>
</div></div></div>
<div id="toast" class="toast"></div>

<script>
const SUPABASE_URL = "https://gpmgzlqgpallmfowdgkd.supabase.co/rest/v1/";
const SUPABASE_ANON_KEY = "sb_publishable_VB82fw7kDis2-9A-Fhzbpw_-yhUS0z1";
let sb=null, mangas=[], chapters=[], pages=[], currentUser=null;

function configured(){return SUPABASE_URL.startsWith("http") && !SUPABASE_URL.includes("YOUR_PROJECT") && !SUPABASE_ANON_KEY.includes("YOUR_")}
if(configured()) sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(window._toast);window._toast=setTimeout(()=>e.style.display="none",2800)}
function hidePages(){document.querySelectorAll(".page").forEach(x=>x.style.display="none")}
function showHome(){hidePages();document.getElementById("homePage").style.display="block";renderLatest();window.scrollTo(0,0)}
function sortedManga(list=mangas){return [...list].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))}
function card(m){return `<article class="card" onclick="openDetail('${m.id}')"><div class="cover">${m.cover_url?`<img src="${escapeHtml(m.cover_url)}" loading="lazy">`:'📚'}</div><div class="body"><div class="title">${escapeHtml(m.title)}</div><div class="meta">⭐ ${m.rating||0} • ${escapeHtml(m.status||'مستمرة')}</div><span class="badge">${escapeHtml(m.type)}</span></div></article>`}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderLatest(){document.getElementById("latestGrid").innerHTML=sortedManga().slice(0,10).map(card).join("")||'<div class="empty">أضف أول عمل من لوحة الإداريين.</div>'}
function showCatalog(type){hidePages();document.getElementById("catalogPage").style.display="block";let list=sortedManga();document.getElementById("catalogTitle").textContent=type==="all"?"📚 الكل":type==="مانجا"?"📖 المانجا":"🇰🇷 المانهوا";if(type!=="all")list=list.filter(x=>x.type===type);document.getElementById("catalogGrid").innerHTML=list.map(card).join("")||'<div class="empty">لا يوجد محتوى.</div>'}
function showFavorites(){hidePages();document.getElementById("favoritesPage").style.display="block";const ids=JSON.parse(localStorage.getItem("mz_favs")||"[]");document.getElementById("favoritesGrid").innerHTML=mangas.filter(x=>ids.includes(x.id)).map(card).join("")||'<div class="empty">لا توجد مفضلة بعد.</div>'}
function toggleFavorite(id){let ids=JSON.parse(localStorage.getItem("mz_favs")||"[]");ids=ids.includes(id)?ids.filter(x=>x!==id):[...ids,id];localStorage.setItem("mz_favs",JSON.stringify(ids));openDetail(id)}
async function openDetail(id){hidePages();document.getElementById("detailPage").style.display="block";const m=mangas.find(x=>x.id===id);if(!m)return;const ch=chapters.filter(x=>x.manga_id===id).sort((a,b)=>Number(b.chapter_number)-Number(a.chapter_number));const fav=JSON.parse(localStorage.getItem("mz_favs")||"[]").includes(id);document.getElementById("detailContent").innerHTML=`<div class="detail"><div class="detail-cover">${m.cover_url?`<img src="${escapeHtml(m.cover_url)}">`:'📚'}</div><div><h1>${escapeHtml(m.title)}</h1><p class="muted">${escapeHtml(m.description||'')}</p><p>${escapeHtml(m.type)} • ${escapeHtml(m.status||'مستمرة')} • ⭐ ${m.rating||0}</p><button class="primary" onclick="toggleFavorite('${m.id}')">${fav?'💔 إزالة من المفضلة':'❤️ إضافة للمفضلة'}</button><div class="chapters">${ch.map(c=>`<div class="chapter"><span>الفصل ${c.chapter_number} ${c.title?'— '+escapeHtml(c.title):''}</span><button onclick="openReader('${c.id}')">قراءة</button></div>`).join("")||'<div class="empty">لا توجد فصول بعد.</div>'}</div></div></div>`}
async function openReader(chapterId){hidePages();document.getElementById("readerPage").style.display="block";const ch=chapters.find(x=>x.id===chapterId);const m=mangas.find(x=>x.id===ch.manga_id);let ps=pages.filter(x=>x.chapter_id===chapterId).sort((a,b)=>a.page_number-b.page_number);document.getElementById("readerContent").innerHTML=`<div class="reader"><div class="reader-toolbar"><button onclick="openDetail('${m.id}')">← تفاصيل</button><button onclick="document.body.style.background='#fff';document.body.style.color='#111'">فاتح</button><button onclick="document.body.style.background='#0b0b10';document.body.style.color='#f3f3f7'">داكن</button><button onclick="changeZoom(1)">＋</button><button onclick="changeZoom(-1)">－</button></div><h2>${escapeHtml(m.title)} — الفصل ${ch.chapter_number}</h2><div id="readerPages" class="pages">${ps.map(p=>`<img src="${escapeHtml(p.image_url||'')}" loading="lazy">`).join("")||'<div class="empty">لا توجد صفحات.</div>'}</div></div>`}
function changeZoom(delta){const imgs=document.querySelectorAll("#readerPages img");imgs.forEach(i=>{const n=Math.max(.5,Math.min(1.8,(parseFloat(i.dataset.z)||1)+delta*.1));i.dataset.z=n;i.style.width=(n*100)+"%"})}
async function searchNow(){const q=document.getElementById("searchInput").value.trim().toLowerCase();hidePages();document.getElementById("catalogPage").style.display="block";document.getElementById("catalogTitle").textContent="نتائج البحث";document.getElementById("catalogGrid").innerHTML=sortedManga(mangas.filter(m=>m.title.toLowerCase().includes(q))).map(card).join("")||'<div class="empty">لا توجد نتائج.</div>'}

async function loadData(){
 if(!sb){renderLatest();return}
 const [m,c,p]=await Promise.all([sb.from("manga").select("*"),sb.from("chapters").select("*"),sb.from("chapter_pages").select("*")]);
 if(m.error) toast("تحقق من إعداد Supabase"); mangas=m.data||[];chapters=c.data||[];
 pages=(p.data||[]).map(x=>({...x,image_url:sb.storage.from("mangazms").getPublicUrl(x.image_path).data.publicUrl}));
 renderLatest();
}

async function openAdmin(){document.getElementById("adminModal").style.display="flex";if(sb){const {data:{user}}=await sb.auth.getUser();currentUser=user;if(user) await renderAdmin()}}
function closeAdmin(){document.getElementById("adminModal").style.display="none"}
async function adminLogin(){if(!sb){toast("أكمل إعداد Supabase أولًا.");return}const email=document.getElementById("adminEmail").value.trim(),password=document.getElementById("adminPassword").value;const {error}=await sb.auth.signInWithPassword({email,password});if(error){toast("بيانات الدخول غير صحيحة.");return}currentUser=(await sb.auth.getUser()).data.user;await renderAdmin();toast("تم تسجيل الدخول")}
async function adminLogout(){if(sb)await sb.auth.signOut();currentUser=null;document.getElementById("adminPanel").style.display="none";document.getElementById("loginBox").style.display="grid";toast("تم تسجيل الخروج")}
async function renderAdmin(){if(!sb||!currentUser)return;const {data:me}=await sb.from("admins").select("*").eq("user_id",currentUser.id).maybeSingle();if(!me){toast("هذا الحساب ليس إداريًا.");await sb.auth.signOut();return}document.getElementById("loginBox").style.display="none";document.getElementById("adminPanel").style.display="block";document.getElementById("adminWho").textContent="مسجل كـ "+me.display_name;document.getElementById("chapterManga").innerHTML=mangas.map(m=>`<option value="${m.id}">${escapeHtml(m.title)}</option>`).join("");const {data:admins}=await sb.from("admins").select("display_name,created_at");document.getElementById("adminList").innerHTML=(admins||[]).map((a,i)=>`<div class="admin-item"><span>👤 ${escapeHtml(a.display_name)}</span><span>${i+1}/2</span></div>`).join("")}
async function addManga(){if(!sb)return;const title=document.getElementById("newTitle").value.trim();if(!title)return toast("اكتب اسم العمل.");const row={title,type:document.getElementById("newType").value,description:document.getElementById("newDesc").value.trim(),cover_url:document.getElementById("newCover").value.trim(),genres:document.getElementById("newGenres").value.split(",").map(x=>x.trim()).filter(Boolean)};const {error}=await sb.from("manga").insert(row);if(error)return toast("تعذر الإضافة: "+error.message);toast("تمت إضافة العمل");document.querySelectorAll("#adminPanel input,#adminPanel textarea").forEach(x=>x.value="");await loadData();await renderAdmin()}
async function uploadChapter(){if(!sb||!currentUser)return;const manga_id=document.getElementById("chapterManga").value,chapter_number=Number(document.getElementById("chapterNumber").value),title=document.getElementById("chapterTitle").value.trim(),files=[...document.getElementById("chapterFiles").files];if(!manga_id||!chapter_number||!files.length)return toast("اختر العمل ورقم الفصل والصور.");const {data:ch,error}=await sb.from("chapters").insert({manga_id,chapter_number,title}).select().single();if(error)return toast("تعذر إنشاء الفصل: "+error.message);for(let i=0;i<files.length;i++){const f=files[i];const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,"_");const path=`chapters/${ch.id}/${String(i+1).padStart(4,"0")}-${safe}`;const up=await sb.storage.from("mangazms").upload(path,f,{upsert:true,contentType:f.type});if(up.error){toast("فشل رفع إحدى الصور");return}const ins=await sb.from("chapter_pages").insert({chapter_id:ch.id,page_number:i+1,image_path:path});if(ins.error){toast("فشل حفظ إحدى الصفحات");return}}toast("تم رفع الفصل بنجاح ✓");document.getElementById("chapterFiles").value="";await loadData();await renderAdmin()}

loadData();
</script>
</body>
</html>
