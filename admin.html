<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mangazms Admin</title><style>body{margin:0;background:#09090d;color:#f7f7fa;font-family:Arial,Tahoma,sans-serif}*{box-sizing:border-box}button,input,textarea,select{font:inherit}.wrap{max-width:1050px;margin:auto;padding:20px}.box{background:#13131a;border:1px solid #292936;border-radius:16px;padding:20px;margin:15px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}input,textarea,select{width:100%;background:#0e0e14;color:#fff;border:1px solid #30303c;border-radius:9px;padding:10px}textarea{min-height:90px}button{border:0;border-radius:9px;padding:10px 14px;background:#8b5cf6;color:#fff;cursor:pointer}.danger{background:#b42336}.muted{color:#aaa}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid #292936;background:#0f0f15;padding:12px;border-radius:11px;margin:8px 0}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}@media(max-width:650px){.row{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><h1>Mangazms — لوحة الإدارة</h1><button onclick="logout()">تسجيل الخروج</button></div><div id="login" class="box"><h2>دخول الإداريين</h2><input id="email" type="email" placeholder="البريد الإلكتروني"><br><br><input id="password" type="password" placeholder="كلمة المرور"><br><br><button onclick="login()">دخول</button><p id="msg" class="muted"></p></div><div id="app" class="hidden"><div class="box"><h2>إضافة مانجا / مانهوا</h2><div class="row"><input id="title" placeholder="اسم العمل"><select id="type"><option value="manga">مانجا</option><option value="manhwa">مانهوا</option></select><input id="author" placeholder="المؤلف"><input id="genre" placeholder="التصنيف"><input id="cover" type="file" accept="image/*"><textarea id="desc" class="full" placeholder="الوصف"></textarea></div><br><button onclick="addManga()">إضافة العمل</button></div><div class="box"><h2>الأعمال والفصول</h2><div id="list"></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let URL='',KEY='',sb=null,works=[];
const $=x=>document.getElementById(x);
async function init(){
  try{
    const r=await fetch('/api/config',{cache:'no-store'}); const cfg=await r.json();
    URL=cfg.url||''; KEY=cfg.anonKey||'';
    if(!URL||!KEY){$('msg').textContent='إعداد Supabase ناقص. تأكد من Environment Variables في Vercel ثم أعد النشر.';return;}
    sb=supabase.createClient(URL,KEY); await boot();
  }catch(e){console.error(e);$('msg').textContent='تعذر تحميل إعدادات قاعدة البيانات.';}
}
async function isAdmin(){let {data:{user}}=await sb.auth.getUser();if(!user)return false;let {data}=await sb.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();return !!data}async function boot(){if(await isAdmin()){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}else{let {data:{session}}=await sb.auth.getSession();if(session)$('msg').textContent='هذا الحساب ليس إدارياً.'}}async function login(){let r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error){$('msg').textContent=r.error.message;return}boot()}async function logout(){await sb.auth.signOut();location.reload()}async function upload(file){let path=crypto.randomUUID()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');let r=await sb.storage.from('mangazms').upload(path,file,{upsert:false});if(r.error)throw r.error;return sb.storage.from('mangazms').getPublicUrl(path).data.publicUrl}async function addManga(){try{let title=$('title').value.trim();if(!title)return alert('اكتب اسم العمل');let cover='';if($('cover').files[0])cover=await upload($('cover').files[0]);let r=await sb.from('mangas').insert({title,type:$('type').value,author:$('author').value.trim(),genre:$('genre').value.trim(),description:$('desc').value.trim(),cover_url:cover}).select().single();if(r.error)throw r.error;alert('تمت الإضافة');['title','author','genre','desc'].forEach(x=>$(x).value='');$('cover').value='';load()}catch(e){alert(e.message)}}async function load(){let r=await sb.from('mangas').select('*').order('created_at',{ascending:false});works=r.data||[];$('list').innerHTML=works.length?works.map(m=>`<div class="item"><div><strong>${esc(m.title)}</strong><div class="muted">${m.type==='manhwa'?'مانهوا':'مانجا'} — ${esc(m.genre||'')}</div></div><div><button onclick="addChapter('${m.id}')">إضافة فصل</button> <button class="danger" onclick="delManga('${m.id}')">حذف العمل</button></div></div>`).join(''):'<p class="muted">لا يوجد محتوى.</p>'}async function addChapter(id){let n=prompt('رقم الفصل');if(!n)return;let title=prompt('عنوان الفصل (اختياري)')||'';let files=await pickFiles();if(!files.length)return;let r=await sb.from('chapters').insert({manga_id:id,number:Number(n),title}).select().single();if(r.error){alert(r.error.message);return}for(let i=0;i<files.length;i++){try{let url=await upload(files[i]);let x=await sb.from('chapter_pages').insert({chapter_id:r.data.id,page_number:i+1,image_url:url});if(x.error)throw x.error}catch(e){alert(e.message)}}alert('تم رفع الفصل');}function pickFiles(){return new Promise(resolve=>{let i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=true;i.onchange=()=>resolve([...i.files]);i.click()})}async function delManga(id){if(!confirm('حذف العمل وكل فصوله؟'))return;let r=await sb.from('mangas').delete().eq('id',id);if(r.error)alert(r.error.message);load()}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}init();</script></body></html>
